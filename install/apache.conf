<VirtualHost *:80>
    ServerAdmin suporte@brandaotech.com.br
    DocumentRoot /var/www/html/btqueue/public

    <Directory /var/www/html/btqueue/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/btqueue_error.log
    CustomLog ${APACHE_LOG_DIR}/btqueue_access.log combined
</VirtualHost>
